version: '3'
services:
  postgres:
    image: postgres:16
    hostname: postgres
    environment:
      POSTGRES_PASSWORD: some-password
      POSTGRES_USER: postgres
      POSTGRES_DB: retroboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retroboard"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'

  backend:
    image: retrospected/backend:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SELF_HOSTED_ADMIN: 'your@email.com'
      DB_PASSWORD: some-password
      SESSION_SECRET: im-a-secret

    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'

  frontend:
    image: retrospected/frontend:local
    depends_on:
      - backend
    ports:
      - '3000:80'
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'

  redis:
    image: redis:latest
    depends_on:
      - postgres
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'

volumes:
  database:
  pgadmin:
