name: "Alpha Build"

on:
  push:
    branches: [lastfixes]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEW_USERNAME }}
          password: ${{ secrets.DOCKER_NEW_PASSWORD }}
      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          file: frontend/Dockerfile
          context: frontend
          tags: retrospected/frontend:alpha
          platforms: linux/amd64
          push: true

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEW_USERNAME }}
          password: ${{ secrets.DOCKER_NEW_PASSWORD }}
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          file: backend/Dockerfile
          context: backend
          tags: retrospected/backend:alpha
          platforms: linux/amd64
          # Same scope build-multiarch.yml uses for retrospected/backend on linux/amd64.
          cache-from: type=gha,scope=retrospected-backend-linux-amd64
          cache-to: type=gha,scope=retrospected-backend-linux-amd64,mode=max,ignore-error=true
          push: true

  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEW_USERNAME }}
          password: ${{ secrets.DOCKER_NEW_PASSWORD }}
      - name: Build and push Marketing
        uses: docker/build-push-action@v6
        with:
          file: marketing/Dockerfile
          context: marketing
          tags: retrospected/marketing:alpha
          platforms: linux/amd64
          push: true

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEW_USERNAME }}
          password: ${{ secrets.DOCKER_NEW_PASSWORD }}
      - name: Build and push Documentation
        uses: docker/build-push-action@v6
        with:
          file: docs/Dockerfile
          context: docs
          tags: retrospected/docs:alpha
          platforms: linux/amd64
          push: true

  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4
      - name: Run Integration Tests
        run: docker compose -f ./integration/docker-compose.ci.alpha.yml up --exit-code-from cypress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test videos
          path: integration/cypress/videos/
          retention-days: 14
