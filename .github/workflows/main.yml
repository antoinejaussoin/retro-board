name: "Main Build"

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.current-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}

  frontend:
    needs: version
    uses: ./.github/workflows/build-multiarch.yml
    with:
      image: retrospected/frontend
      file: frontend/Dockerfile
      context: frontend
      tags: |
        retrospected/frontend:latest
        retrospected/frontend:${{ needs.version.outputs.version }}
    secrets:
      DOCKER_NEW_USERNAME: ${{ secrets.DOCKER_NEW_USERNAME }}
      DOCKER_NEW_PASSWORD: ${{ secrets.DOCKER_NEW_PASSWORD }}

  backend:
    needs: version
    uses: ./.github/workflows/build-multiarch.yml
    with:
      image: retrospected/backend
      file: backend/Dockerfile
      context: backend
      tags: |
        retrospected/backend:latest
        retrospected/backend:${{ needs.version.outputs.version }}
      cache: true
    secrets:
      DOCKER_NEW_USERNAME: ${{ secrets.DOCKER_NEW_USERNAME }}
      DOCKER_NEW_PASSWORD: ${{ secrets.DOCKER_NEW_PASSWORD }}

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEW_USERNAME }}
          password: ${{ secrets.DOCKER_NEW_PASSWORD }}
      - name: Build and push Documentation
        uses: docker/build-push-action@v6
        with:
          file: docs/Dockerfile
          context: docs
          tags: retrospected/docs:latest,retrospected/docs:${{ steps.package.outputs.current-version }}
          platforms: linux/amd64
          push: true

  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEW_USERNAME }}
          password: ${{ secrets.DOCKER_NEW_PASSWORD }}
      - name: Build and push Marketing
        uses: docker/build-push-action@v6
        with:
          file: marketing/Dockerfile
          context: marketing
          tags: retrospected/marketing:latest,retrospected/marketing:${{ steps.package.outputs.current-version }}
          platforms: linux/amd64
          push: true

  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEW_USERNAME }}
          password: ${{ secrets.DOCKER_NEW_PASSWORD }}
      - name: Build and push Maintenance
        uses: docker/build-push-action@v6
        with:
          file: maintenance/Dockerfile
          context: maintenance
          tags: retrospected/maintenance:latest,retrospected/maintenance:${{ steps.package.outputs.current-version }}
          platforms: linux/amd64
          push: true

  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4
      - name: Run Integration Tests
        run: docker compose -f ./integration/docker-compose.ci.main.yml up --exit-code-from cypress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test videos
          path: integration/cypress/videos/
          retention-days: 14
