name: "Canary Build"

on:
  push:
    branches: [main]

jobs:
  frontend:
    uses: ./.github/workflows/build-multiarch.yml
    with:
      image: retrospected/frontend
      file: frontend/Dockerfile
      context: frontend
      tags: retrospected/frontend:canary
    secrets:
      DOCKER_NEW_USERNAME: ${{ secrets.DOCKER_NEW_USERNAME }}
      DOCKER_NEW_PASSWORD: ${{ secrets.DOCKER_NEW_PASSWORD }}

  backend:
    uses: ./.github/workflows/build-multiarch.yml
    with:
      image: retrospected/backend
      file: backend/Dockerfile
      context: backend
      tags: retrospected/backend:canary
      cache: true
    secrets:
      DOCKER_NEW_USERNAME: ${{ secrets.DOCKER_NEW_USERNAME }}
      DOCKER_NEW_PASSWORD: ${{ secrets.DOCKER_NEW_PASSWORD }}

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEW_USERNAME }}
          password: ${{ secrets.DOCKER_NEW_PASSWORD }}
      - name: Build and push Documentation
        uses: docker/build-push-action@v6
        with:
          file: docs/Dockerfile
          context: docs
          tags: retrospected/docs:canary
          platforms: linux/amd64
          push: true

  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION
        id: package
        uses: martinbeentjes/npm-get-version-action@master
      - name: Echo VERSION
        run: echo ${{ steps.package.outputs.current-version }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NEW_USERNAME }}
          password: ${{ secrets.DOCKER_NEW_PASSWORD }}
      - name: Build and push Marketing
        uses: docker/build-push-action@v6
        with:
          file: marketing/Dockerfile
          context: marketing
          tags: retrospected/marketing:canary
          platforms: linux/amd64
          push: true

  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4
      - name: Run Integration Tests
        run: docker compose -f ./integration/docker-compose.ci.canary.yml up --exit-code-from cypress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test videos
          path: integration/cypress/videos/
          retention-days: 14
